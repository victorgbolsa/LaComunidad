services:
  # ── Servidor web principal ─────────────────────────────────────────────────
  - type: web
    name: lacomunidad-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 600 --workers 1
    plan: pro
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USER
        value: victorgbolsa
      - key: GITHUB_REPO
        value: LaComunidad
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SUPABASE_URL
        value: https://othghdtplmlkrqwfcjzk.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

  # ── Cron 1: Dashboard cada día a las 16:00 y 11:00 Madrid (= 7:00 UTC en invierno) ─
  - type: cron
    name: cron-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 14,21 * * 1-5"   # Lunes a viernes 16:00 UTC y 11:00H  Madrid 
    startCommand: python -c "import requests; r = requests.get('https://lacomunidad-server.onrender.com/cron/dashboard', timeout=600); print(r.json())"
    plan: pro

  # ── Cron 2: Alertas cada minuto en horario mercado ────────────────────────
  - type: cron
    name: cron-alertas
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "* 14-21 * * 1-5"  # Cada minuto de 14:00 a 21:00 UTC, L-V
    startCommand: python -c "import requests; r = requests.get('https://lacomunidad-server.onrender.com/cron/alertas', timeout=30); print(r.json())"
    plan: pro

  # ── Cron 3: Email semanal lunes 9:00 Madrid (= 8:00 UTC) ─────────────────
  - type: cron
    name: cron-email-semanal
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 8 * * 1"   # Lunes 8:00 UTC (9:00 Madrid)
    startCommand: python -c "import requests; r = requests.get('https://lacomunidad-server.onrender.com/cron/email', timeout=60); print(r.json())"
    plan: pro
